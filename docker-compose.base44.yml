services:
  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx tsx watch src/index.ts"]
    volumes:
      - ./server:/app
      - api-data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/sessions.db
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-6cbc78e35d97deace95b74a5f8e676a11139212e30383e1d95663983bdc24d37}
      - WORKER_SECRET=${WORKER_SECRET:-1f42963f25dbe6c559a96b681dbc438c524190d29ce1e7f2}
      - BASE44_FUNCTION_URL=${BASE44_FUNCTION_URL:-https://base44.app/api/apps/6a444b036408e68ec8d6f2a6/functions/meteredChat}
      - BASE44_WORKER_URL=${BASE44_WORKER_URL:-https://base44.app/api/apps/6a444b036408e68ec8d6f2a6/functions/meteredChatWorker}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.main.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  api-data:
